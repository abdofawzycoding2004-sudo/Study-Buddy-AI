{% extends 'base.html' %}
{% block title %}إضافة وحدة دراسية{% endblock %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-bold brand-color mb-4">إضافة وحدة دراسية</h2>
    <div class="card p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                {% for field in form %}
                    <div class="col-md-6">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-brand">حفظ</button>
                <a href="{% url 'teacher_panel:course_detail' course.pk %}" class="btn btn-outline-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
