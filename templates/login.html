{% extends 'base.html' %}
{% block title %}تسجيل الدخول - EduMentor AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center brand-color fw-bold mb-4">تسجيل الدخول</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-brand w-100">دخول</button>
                </form>
                <div class="mt-3 text-center">
                    <small>ليس لديك حساب؟ <a href="{% url 'register_teacher' %}" class="brand-color">إنشاء حساب مدرس</a> | <a href="{% url 'register_student' %}" class="brand-color">إنشاء حساب طالب</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
