{% extends 'base.html' %}
{% block title %}Delete Timetable Slot - EduMentor{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card p-4 text-center">
                <h2 class="h4 mb-3">Delete Timetable Slot?</h2>
                <p class="text-muted mb-4">
                    {{ object }}<br>
                    <small>{{ object.start_time|time:"H:i" }} - {{ object.end_time|time:"H:i" }} | {{ object.duration_formatted }}</small>
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="{% url 'teacher_timetable' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
