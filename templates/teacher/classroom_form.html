{% extends 'base.html' %}
{% block title %}New Class - EduMentor{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card p-4">
                <h2 class="h4 mb-4">Add New Class</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-medium">{{ field.label }}</label>
                            {{ field }}
                            {% for err in field.errors %}
                                <div class="text-danger small">{{ err }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-brand">Create Class</button>
                        <a href="{% url 'teacher_timetable' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
