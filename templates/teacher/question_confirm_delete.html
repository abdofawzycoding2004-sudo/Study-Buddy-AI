{% extends 'base.html' %}
{% block title %}Delete Question - EduMentor{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-lg-5">
  <div class="card p-4 text-center">
    <h2 class="h4 mb-3">Delete Question?</h2>
    <p class="text-muted mb-4">{{ object.question_text|truncatewords:20 }}</p>
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'assessment_questions' object.assessment.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div></div></div>
{% endblock %}
